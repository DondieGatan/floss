services:
  - type: web
    name: floss-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && flask db upgrade && python seed.py && python seed_knowledge_base.py"
    # Generous safety margin on top of gunicorn's 30s default — a slow Groq
    # response or a cold Hugging Face Inference API call (see app/ml.py)
    # shouldn't turn into a 500.
    startCommand: "gunicorn run:app --timeout 120"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: FRONTEND_URL
        value: https://floss-beta.vercel.app
