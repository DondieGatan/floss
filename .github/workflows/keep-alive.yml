name: Keep backend warm

on:
  schedule:
    # Every 10 minutes — Render's free tier sleeps after ~15 minutes idle.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping floss-backend
        run: curl -fsS --max-time 90 https://floss-backend.onrender.com/api/health
