name: Keep backend warm (manual)

# This used to run every 5 minutes (cron '*/5 * * * *'). That kept the Render
# free-tier backend awake around the clock, which alone uses ~720 of Render's
# 750 free instance hours per month and, together with the other services,
# got the whole workspace suspended in October 2026. The schedule is removed;
# the job can still be run by hand (Actions -> Run workflow) to wake the backend
# before a demo.
on:
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping floss-backend
        run: curl -fsS --max-time 90 https://floss-backend.onrender.com/api/health
