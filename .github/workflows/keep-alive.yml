name: Keep backend warm

on:
  schedule:
    # 5 minutes is GitHub Actions' minimum scheduling granularity — asked
    # for anything tighter than that and it silently coalesces to 5m
    # anyway. Even at 5m, GitHub's actual firing cadence for scheduled
    # workflows lags the requested interval under load (observed ~40
    # minutes between runs against this exact schedule at */10), so this
    # is picked to maximize the odds of landing inside Render's free-tier
    # ~15-minute idle-sleep window, not a guarantee against it.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping floss-backend
        run: curl -fsS --max-time 90 https://floss-backend.onrender.com/api/health
