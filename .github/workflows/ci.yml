name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30's bundled undici needs a Node webidl internal
          # (markAsUncloneable) that doesn't exist on Node 20 — it crashes
          # every test file on startup with no indication it's a Node
          # version issue. Pinned to what's actually been run locally.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build (fails on any bundling/type error Vitest wouldn't catch)
        run: npm run build

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Chromium only — the other engines Playwright can drive aren't worth
      # the extra install time for a suite that isn't testing browser
      # compatibility, just that the app's own flows actually work.
      - name: Install Playwright's Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Starts both the backend (migrate + seed + serve) and frontend dev
      # server itself — see frontend/playwright.config.js's webServer
      # entries — so this is the only step actually running the suite.
      - name: Run E2E suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  backend-security:
    name: Backend dependency audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit for known vulnerabilities
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend-security:
    name: Frontend dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # High/critical only — low/moderate findings are frequently in
      # dev-only tooling with no real exposure and no fix available yet;
      # failing CI on those trains everyone to ignore red builds instead
      # of actually catching the ones that matter.
      - name: Audit for known vulnerabilities (high/critical only)
        run: npm audit --audit-level=high
